# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# Serviço PowerSync (Open Edition) local, ao lado do Supabase. Sobe com scripts/powersync.sh.
replication:
  connections:
    - type: postgresql
      uri: !env PS_SOURCE_PG_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_PG_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience: ['authenticated']

telemetry:
  disable_telemetry_sharing: true
