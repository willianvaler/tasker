# O que cada pessoa recebe no aparelho: tudo das pastas de que é membro. A participação mora na
# pasta raiz e as pastas só têm um nível de subpasta, então cada tabela tem duas consultas: a da
# raiz e a das subpastas dela. Perder o acesso tira os dados do aparelho.
config:
  edition: 3

streams:
  folders:
    auto_subscribe: true
    with:
      roots: SELECT folder_id FROM folder_members WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM folders WHERE id IN roots
      - SELECT * FROM folders WHERE parent_id IN roots
      # folder_members não tem coluna id: o id local é "pasta:pessoa"
      - SELECT folder_id || ':' || user_id AS id, folder_id, user_id, role, joined_at, aliases, source, custom_role_id FROM folder_members WHERE folder_id IN roots
      # Cargos personalizados em uso nos meus projetos: o aparelho esconde o que o cargo não permite
      - SELECT team_roles.id, team_roles.team_id, team_roles.name, team_roles.grants FROM team_roles INNER JOIN folder_members ON folder_members.custom_role_id = team_roles.id WHERE folder_members.folder_id IN roots
      - SELECT * FROM pages WHERE folder_id IN roots
      - SELECT pages.* FROM pages INNER JOIN folders ON pages.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM tasks WHERE folder_id IN roots
      - SELECT tasks.* FROM tasks INNER JOIN folders ON tasks.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM task_assignees WHERE folder_id IN roots
      - SELECT task_assignees.* FROM task_assignees INNER JOIN folders ON task_assignees.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM comments WHERE folder_id IN roots
      - SELECT comments.* FROM comments INNER JOIN folders ON comments.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM task_completions WHERE folder_id IN roots
      - SELECT task_completions.* FROM task_completions INNER JOIN folders ON task_completions.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM milestones WHERE folder_id IN roots
      - SELECT * FROM task_dependencies WHERE folder_id IN roots
      - SELECT task_dependencies.* FROM task_dependencies INNER JOIN folders ON task_dependencies.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM page_dependencies WHERE folder_id IN roots
      - SELECT page_dependencies.* FROM page_dependencies INNER JOIN folders ON page_dependencies.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM page_fields WHERE folder_id IN roots
      - SELECT page_fields.* FROM page_fields INNER JOIN folders ON page_fields.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM time_entries WHERE folder_id IN roots
      - SELECT time_entries.* FROM time_entries INNER JOIN folders ON time_entries.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM task_attachments WHERE folder_id IN roots
      - SELECT task_attachments.* FROM task_attachments INNER JOIN folders ON task_attachments.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM expenses WHERE folder_id IN roots
      - SELECT expenses.* FROM expenses INNER JOIN folders ON expenses.folder_id = folders.id WHERE folders.parent_id IN roots
      - SELECT * FROM conflict_copies WHERE folder_id IN roots
      - SELECT conflict_copies.* FROM conflict_copies INNER JOIN folders ON conflict_copies.folder_id = folders.id WHERE folders.parent_id IN roots

  # Biblioteca de exercícios (AC3.6): o catálogo inteiro (só leitura) e os meus próprios; os de
  # projeto vêm com as pastas
  exercises:
    auto_subscribe: true
    with:
      roots: SELECT folder_id FROM folder_members WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM exercises
      - SELECT * FROM user_exercises WHERE owner_id = auth.user_id()
      - SELECT * FROM user_exercises WHERE folder_id IN roots

  # Nome e avatar de quem divide pasta comigo (responsáveis, comentários, @nome)
  people:
    auto_subscribe: true
    with:
      roots: SELECT folder_id FROM folder_members WHERE user_id = auth.user_id()
    query: SELECT people.id, people.display_name, people.avatar_url FROM profiles AS people INNER JOIN folder_members ON folder_members.user_id = people.id WHERE folder_members.folder_id IN roots

  # Séries feitas (J1): só as minhas; id local "tarefa:pessoa"
  progress:
    auto_subscribe: true
    query: SELECT task_id || ':' || user_id AS id, task_id, user_id, done_reps, logged_values, cycle_key, updated_at FROM task_progress WHERE user_id = auth.user_id()

  # Diário de treino (AC4): as minhas séries, para o histórico e os recordes sem internet
  workout_sets:
    auto_subscribe: true
    query: SELECT * FROM workout_sets WHERE user_id = auth.user_id()

  # Peso e medidas (AC7, dado sensível): só os meus, e o consentimento dado
  body:
    auto_subscribe: true
    queries:
      - SELECT * FROM body_metrics WHERE user_id = auth.user_id()
      - SELECT * FROM body_goals WHERE user_id = auth.user_id()
      - SELECT * FROM sensitive_consents WHERE user_id = auth.user_id()

  # Temporizadores (J2): os meus, para o ativo aparecer em todos os aparelhos
  timers:
    auto_subscribe: true
    query: SELECT * FROM timers WHERE user_id = auth.user_id()

  # Tempo registrado sem tarefa (pomodoro solto); o das tarefas vem com as pastas
  my_time:
    auto_subscribe: true
    query: SELECT * FROM time_entries WHERE user_id = auth.user_id() AND task_id IS NULL

  # Páginas recebidas ao vivo (L): a página e as tarefas, sem a pasta do autor; e os meus envios
  received:
    auto_subscribe: true
    with:
      shared: SELECT page_id FROM page_shares WHERE recipient_id = auth.user_id() AND status = 'active' AND mode = 'live'
      senders: SELECT owner_id FROM page_shares WHERE recipient_id = auth.user_id()
    queries:
      - SELECT * FROM pages WHERE id IN shared
      # Nome e avatar de quem me enviou ("Recebida de Ana")
      - SELECT people.id, people.display_name, people.avatar_url FROM profiles AS people WHERE people.id IN senders
      - SELECT * FROM tasks WHERE page_id IN shared
      - SELECT * FROM page_fields WHERE page_id IN shared
      - SELECT * FROM page_shares WHERE recipient_id = auth.user_id()
      - SELECT * FROM share_checks WHERE user_id = auth.user_id()

  # Meu dia (M4)
  my_day:
    auto_subscribe: true
    query: SELECT * FROM my_day WHERE user_id = auth.user_id()

  # Anotações (W3): só as minhas
  notes:
    auto_subscribe: true
    query: SELECT * FROM notes WHERE user_id = auth.user_id()

  me:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()
