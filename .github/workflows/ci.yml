name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run export:web

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: cp .env.example .env.local
      # Storage fica ligado: os anexos (N1) precisam dele
      - run: supabase start -x imgproxy,studio,edge-runtime,logflare,vector,supavisor
      # O app sincroniza pelo PowerSync (D82): sobe o serviço ao lado do Supabase
      - run: bash scripts/powersync.sh
        env:
          CONTAINER: docker
          DETACH: 1
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
